[package]
name = "scatterbrain"
version = "0.1.0"
edition = "2021"

[dependencies]
xilem = { git = "https://github.com/linebender/xilem", version = "0.1.0" }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
